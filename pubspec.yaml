name: flutter_smooth_wheel_scroll
description: "Smooth, adjustable mouse wheel scrolling for Flutter desktop: scale the wheel distance app-wide and animate it per scroll view with a spring, curve or lerp."
version: 0.1.1
homepage: https://github.com/kihyun1998/flutter_smooth_wheel_scroll
repository: https://github.com/kihyun1998/flutter_smooth_wheel_scroll
issue_tracker: https://github.com/kihyun1998/flutter_smooth_wheel_scroll/issues

topics:
  - scroll
  - mouse
  - desktop
  - animation
  - windows

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
