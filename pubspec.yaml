name: flutter_smooth_wheel_scroll
description: "Scales mouse wheel scrolling app-wide and animates it per scroll view, fixing the fast, stepped wheel scrolling of Flutter desktop."
version: 0.0.1
homepage: https://github.com/kihyun1998/flutter_smooth_wheel_scroll
repository: https://github.com/kihyun1998/flutter_smooth_wheel_scroll
issue_tracker: https://github.com/kihyun1998/flutter_smooth_wheel_scroll/issues

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
